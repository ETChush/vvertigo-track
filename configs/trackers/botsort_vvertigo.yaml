# BoT-SORT for 60fps handheld dance footage
tracker_type: botsort
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.35
track_buffer: 90        # 60fps 下 1.5 秒；默认 30 帧只有 0.5 秒，交叉遮挡必断
match_thresh: 0.80
fuse_score: True
gmc_method: sparseOptFlow   # 手持机位必须开；固定三脚架可改 none 提速约 1.7x
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
